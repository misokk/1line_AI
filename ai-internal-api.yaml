x-integration-notes:
  authentication:
  - health 외 모든 내부 HTTP 요청에 X-AI-API-Key가 필수이다. 프론트엔드에 서버 키를 전달하지 않는다.
  - 외부 텍스트 AI 호출에는 X-AI-Key가 우선한다. 없으면 AI_USE_SERVER_TEXT_KEY=true일 때 서버 GEMINI_API_KEY로 대체한다. 둘 다 없으면 실패한다.
  - 자료 추출은 서버 UPSTAGE_API_KEY(PDF/PNG/JPEG), 음성은 서버 GEMINI_API_KEY를 사용한다. TXT·시간·계획·로컬 채점에는 외부 AI 키가 필요 없다.
  - 텍스트 생성에는 AI_LIVE_ENABLED=true가 필요하다. 음성에는 GEMINI_LIVE_ENABLED=true가 필요하며 텍스트 스위치와 별개이다.
  models:
  - 텍스트 생성·분석·평가·설명·키워드는 model_id를 반드시 전달한다. 스키마에서는 nullable/생략 가능하지만 HTTP 실행 함수가 없거나 빈 값을 422로 거절한다.
  - 객관식·정확 일치 단답형 채점은 model_id 없이 가능하다. 의미 채점으로 넘어가면 명시적 model_id와 텍스트 AI 설정이 필요하다.
  - gemini:<model-name> 형태를 사용한다. 서버 허용 목록의 활성 모델이어야 하며 AI_ALLOW_UNLISTED_MODELS=true이면 목록 밖 유효 Gemini 이름도 허용한다.
    실제 모델 접근성은 별도이다.
  - GEMINI_TEXT_MODEL은 기본 목록/기본 라우트를 구성한다. HTTP 생성 요청의 필수 model_id를 대신하지 않는다.
  - 음성 모델은 서버 GEMINI_LIVE_MODEL 설정이다. 음성 세션 생성 입력에는 model_id가 없고 음성 평가 요청의 model_id는 텍스트 평가용이다.
  backend_workflow:
  - extract의 chunk_drafts를 백엔드가 저장하며 각 청크 UUID v4를 발급한다. SourceChunk(id, material_id, material_name, page_number,
    text)를 구성해 analyze로 보낸다.
  - analyze 결과는 state=draft이다. 사용자 검토 후 백엔드가 단원/개념/버전/체크리스트 UUID v4와 confirmed_at을 저장한다.
  - StudyContext는 확정 버전과 원문 SourceChunk이다. 근거의 청크·자료 ID/자료명/페이지/발췌가 원문과 일치해야 한다. 확정 과거 버전(is_current=false)도 허용한다.
  - 버전/개념/체크리스트/원문 관계를 보존한다. ID만 보내면 AI 서버가 DB에서 조회하는 구조가 아니다. 개인정보·접근 권한은 호출 전에 백엔드가 확인한다.
  - 문제 생성 items(StoredQuestion)에는 정답·해설이 들어 있다. 비공개 저장 후 public_question 투영과 백엔드 문제 ID를 사용해 풀이 전 공개한다.
  - 평가 report는 저장 전 결과이다. 공개 SessionReport에는 백엔드가 report_id/session_id/version_no/action_id와 각 report item ID를 추가해야
    한다(src.evaluation.session_report 참고).
  - previous_result에는 EvaluationResult만 전달한다. 저장용 SessionReport의 추가 DB 필드를 그대로 넣으면 extra=forbid 검증에 실패한다. DetailedEvaluationResult에서는
    report를 사용한다.
  - 계획에는 DB ID/완료 이력/리비전이 없다. 백엔드가 날짜별 tasks를 저장하고 사용자별 진행 상태를 관리한다.
  runtime_limits:
  - '요청 본문 상한: extract 20971520 bytes, 나머지 HTTP 2097152 bytes. schema 배열 상한 이내여도 본문 총량 제한이 먼저 적용된다.'
  - 프로세스별 동시 작업 슬롯 2개를 HTTP와 음성 WebSocket이 공유한다. 초과 HTTP 429, WebSocket 4429. 영구 큐는 없다.
  - 외부 SDK 자동 재시도/모델 자동 변경 없음. 한 기능 요청은 내부 분할로 여러 외부 호출을 할 수 있다. 실패 시 부분 성공 응답은 반환하지 않는다.
  - AI_TIMEOUT_SECONDS는 각 텍스트 SDK 호출 제한(코드 기본 60초, README 개발 예시 120초)이다. 여러 배치의 HTTP 전체 시간 제한이 아니다. 백엔드/프록시 제한을
    별도로 설정한다.
  - POST 생성 요청 전체의 멱등성/중복 과금 방지는 제공하지 않는다. 타임아웃·연결 단절 후 무조건 재호출하지 말고 백엔드 Job 상태와 중복 실행을 관리한다.
  - 생략한 today는 한국 시간(UTC+09:00) 오늘이다. 명시한 today가 계산 기준이다. 학습 시간은 추정값이다.
  public_backend_contract_differences:
  - 기존 swagger-api-final.yaml은 별도 사용자용 명세이며 이 파일로 수정/대체하지 않는다.
  - 현재 내부 문제 생성은 count 5~20, mixed+difficulty_plan, question_types를 지원한다. 기존 공개 문제 생성 명세의 count 1~20/단일 난이도와 다르다.
  - 계획 activity practice→공개 task_type solve, teachback→teach_back, review→review 매핑이 필요하다. learn은 기존 공개 enum에 없어
    별도 합의가 필요하다.
  - 내부 계획 count는 학습/복습 시 체크리스트 수, practice 시 문항 수, teachback 시 세션 수이다. 날짜별 합산 count가 공개 target_count 상한 20을 넘으면
    활동 의미에 맞게 분할/명세 조정이 필요하다.
  - 음성은 한국어 고정, 학생 유형 선택 없음, 질문 수 제한 없음이다. 기존 공개 세션 질문 최대 3회/ko,en/persona와 직접 호환되지 않는다.
  - 상세 평가 feedback/comparison과 실시간 음성 연결 정보는 기존 공개 응답과 별도로 저장/노출 방식을 합의해야 한다.
x-error-contract: 공통 오류 목록이며 기능에 따라 적용 범위가 다르다. 외부 AI를 호출하지 않는 시간/계획 계산에는 공급자 오류가 발생하지 않는다. 예상하지 못한 서버 예외는 500일
  수 있으며 본문 형식을 보장하지 않는다.
x-websocket:
  path: /internal/teachback/sessions/{session_id}/audio
  description: OpenAPI HTTP paths에 포함되지 않는 WebSocket 전용 계약. 서버 키 대신 세션 생성에서 받은 1회용 토큰으로 인증한다.
  sequence:
  - 백엔드가 서버 인증키로 HTTP 세션 생성. 응답의 websocket_path에 ws/wss origin을 결합한다.
  - 연결 후 10초 이내 첫 텍스트 프레임으로 authenticate를 보낸다. 토큰은 세션 생성 시점부터 60초·1회용이다.
  - ready를 받은 뒤 오디오를 보내며 서버의 바이너리 오디오를 재생한다. 자막 JSON도 병행 수신한다.
  - 사용자 종료 시 end를 보내고 closed까지 계속 수신한다. 즉시 소켓을 끊으면 정상 종료/전사 완결을 보장하지 못한다.
  - closed status=closed와 provider_finalized=true 확인 후 HTTP 평가를 호출한다. 실패/미완성 세션은 평가하지 않는다.
  client_messages:
    authenticate:
      transport: text JSON
      schema:
        type: object
        required:
        - type
        - connection_token
        properties:
          type:
            const: authenticate
          connection_token:
            type: string
            maxLength: 200
        additionalProperties: false
    audio:
      transport: binary
      encoding: raw mono PCM16 little endian, 24000 Hz
      max_frame_bytes: 9600
      frame_rules: 0 bytes 금지, 짝수 길이, 최대 200ms. WAV 헤더/WebM/Opus/base64 JSON은 지원하지 않는다. 실시간 속도로 전송한다.
    end:
      transport: text JSON
      schema:
        type: object
        required:
        - type
        properties:
          type:
            const: end
        additionalProperties: false
  server_messages:
    ready:
      transport: text JSON
      example:
        type: ready
        sample_rate: 24000
    audio:
      transport: binary
      encoding: raw mono PCM16 little endian, 24000 Hz
    transcript:
      transport: text JSON
      schema:
        properties:
          role:
            type: string
            enum:
            - user
            - assistant
            title: Role
          delta:
            type: string
            maxLength: 4000
            title: Delta
          start_ms:
            type: integer
            minimum: 0.0
            title: Start Ms
          end_ms:
            type: integer
            minimum: 0.0
            title: End Ms
          type:
            type: string
            const: transcript
        additionalProperties: false
        type: object
        required:
        - role
        - delta
        - start_ms
        - end_ms
        - type
        title: TranscriptFragment
      description: TranscriptFragment의 role/delta/start_ms/end_ms에 type=transcript 필드를 추가한 이벤트. delta는 저장된 전사 조각이며
        중복 이어붙임에 주의한다. 시각은 세션 연결 이후 서버 수신/커밋 기준 근사 ms로 발화 시작 시각 보장이 없다.
    playback.clear:
      transport: text JSON
      example:
        type: playback.clear
      description: 프론트는 재생 큐를 즉시 비우고 현재 AI 재생을 중단한다. 끼어들기/종료 등에 전송된다.
    closed:
      transport: text JSON
      example:
        type: closed
        status: closed
        provider_finalized: true
        error_code: null
      description: status는 closed 또는 failed. 실패 시 error_code가 설정될 수 있다. 마지막 JSON과 소켓 종료를 구분한다.
  close_codes:
    '1000': 정상 소켓 종료. 세션 성공 여부는 closed 이벤트/provider_finalized로 별도 확인.
    '4401': 인증 형식 오류/토큰 무효·만료·재사용/인증 대기 시간 초과 등.
    '4429': 동시 작업 슬롯 부족.
  lifecycle:
  - 최대 32개 세션을 단일 프로세스 메모리에 보관한다. 생성 후 max_duration_seconds+900초가 지나면 조회 불가. 서버 재시작 시 모두 소실된다.
  - 최대 연결 시간은 응답 max_duration_seconds(기본 300초). 도달하면 서버가 종료를 시작한다. 입력이 있으면 공급자 종료 확인을 최대 15초 기다리므로 종료 드레인 시간이 추가될
    수 있다.
  - 새 세션 생성은 새 대화이다. 사용한 토큰으로 재연결/대화 재개는 지원하지 않는다. 다중 워커/다중 인스턴스 공유 저장소도 없다.
  - AI 학생 질문은 횟수 제한이 없으며 question_count는 assistant 전사 내 물음표 개수의 근사값이다.
  - 백엔드가 사용자 권한과 세션 소유권을 확인하며 프론트에는 서버 인증키/외부 AI 키를 전달하지 않는다.
