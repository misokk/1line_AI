      description: stored_question과 answer를 하나씩 전달한다. 객관식·정확 일치 단답형은 Python 처리, 나머지 단답형은 의미 평가를 수행한다. 의미 평가에는 명시적
        model_id가 필요하므로 백엔드는 항상 전달하는 것이 좋다. 채점 전에 풀이자에게 정답을 노출하지 않는다.
      tags:
      - 문제
      parameters:
      - name: X-AI-Key
        in: header
        required: false
        description: 선택 헤더. 텍스트 AI 호출용 BYOK이며 서버 인증키를 대신하지 않는다. 서버 키 대체 설정이 꺼져 있으면 외부 텍스트 호출에 필수이다.
