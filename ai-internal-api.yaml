            - $ref: '#/components/schemas/HTTPDetailEnvelope'
    InternalError409:
      description: 'DOCUMENT_PROCESSING_STATE: 문서 인식 상태 충돌. 또는 동일 음성 세션 평가 진행 중(detail 형식).'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AIErrorEnvelope'
            - $ref: '#/components/schemas/HTTPDetailEnvelope'
    InternalError413:
      description: Request body exceeds size limit.
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/HTTPDetailEnvelope'
    InternalError422:
      description: VALIDATION_ERROR / MODEL_NOT_ALLOWED / PROVIDER_AUTH. 입력·모델 허용 목록·외부 접근 권한 확인.
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/RuntimeValidationEnvelope'
            - $ref: '#/components/schemas/AIErrorEnvelope'
    InternalError429:
      description: RATE_LIMITED 또는 작업 슬롯 초과(detail 형식). 외부 제한은 Retry-After가 포함될 수 있다.
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AIErrorEnvelope'
            - $ref: '#/components/schemas/HTTPDetailEnvelope'
      headers:
        Retry-After:
          description: 외부 공급자가 재시도 대기 시간을 제공한 경우에만 포함한다.
          schema:
            type: string
    InternalError502:
      description: INVALID_OUTPUT / PROVIDER_REQUEST_INVALID / PROVIDER_BAD_GATEWAY / PROVIDER_UNAVAILABLE. 공급자
        요청 거절이나 불완전 출력도 실패이다.
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AIErrorEnvelope'
    InternalError503:
      description: CONFIGURATION_ERROR / KEY_VALIDATION_UNAVAILABLE / PROVIDER_SERVICE_UNAVAILABLE. 또는 서버 인증 미설정(detail
        형식).
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AIErrorEnvelope'
            - $ref: '#/components/schemas/HTTPDetailEnvelope'
    InternalError504:
      description: PROVIDER_TIMEOUT. 외부 처리 완료/과금 여부를 보장하지 않는다.
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AIErrorEnvelope'
