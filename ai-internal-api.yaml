components:
  schemas:
    AnalyzeRequest:
      properties:
        model_id:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Model Id
          description: 외부 텍스트 AI 호출에서는 명시 필수. 스키마 기본값 null은 런타임 생략 허용을 뜻하지 않는다. 로컬 채점은 예외.
        chunks:
          items:
            $ref: '#/components/schemas/SourceChunk'
          type: array
          maxItems: 200
          minItems: 1
          title: Chunks
        explanation_language:
          type: string
          enum:
          - ko
          - en
          title: Explanation Language
          default: ko
        chunk_chars:
          type: integer
          maximum: 12000.0
          minimum: 500.0
          title: Chunk Chars
          default: 10000
        max_calls:
          type: integer
          maximum: 40.0
          minimum: 1.0
          title: Max Calls
          default: 10
      additionalProperties: false
      type: object
      required:
      - chunks
      title: AnalyzeRequest
    AnswerVerification:
      properties:
        status:
          type: string
          enum:
          - consistent
          - inconsistent
          - not_verified
          title: Status
        scope:
          type: string
          title: Scope
      additionalProperties: false
      type: object
      required:
      - status
      - scope
      title: AnswerVerification
    ChunkDraft:
      properties:
        ordinal:
          type: integer
          minimum: 1.0
          title: Ordinal
        page_number:
          type: integer
          minimum: 1.0
          title: Page Number
        text:
          type: string
          maxLength: 12000
          minLength: 1
          title: Text
      additionalProperties: false
      type: object
      required:
      - ordinal
      - page_number
      - text
      title: ChunkDraft
    ConceptChecklistItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        ordinal:
          type: integer
          minimum: 1.0
          title: Ordinal
        criterion:
          type: string
          maxLength: 2000
          minLength: 1
          title: Criterion
      additionalProperties: false
      type: object
      required:
      - id
      - ordinal
      - criterion
      title: ConceptChecklistItem
    ConceptTime:
      properties:
        concept_version_id:
          type: string
          format: uuid
          title: Concept Version Id
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        learning_minutes:
          type: integer
          title: Learning Minutes
        question_minutes:
          type: integer
          title: Question Minutes
        review_minutes:
          type: integer
          title: Review Minutes
        total_minutes:
          type: integer
          title: Total Minutes
        priority:
          type: number
          title: Priority
        teachback_minutes:
          type: integer
          title: Teachback Minutes
          default: 0
      additionalProperties: false
      type: object
      required:
      - concept_version_id
      - name
      - learning_minutes
      - question_minutes
      - review_minutes
      - total_minutes
      - priority
      title: ConceptTime
    ConceptVersion:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        version_no:
          type: integer
          minimum: 1.0
          title: Version No
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        summary:
          anyOf:
          - type: string
            maxLength: 12000
          - type: 'null'
          title: Summary
        is_confirmed:
          type: boolean
          title: Is Confirmed
        is_current:
          type: boolean
          title: Is Current
        confirmed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Confirmed At
        checklist_items:
          items:
            $ref: '#/components/schemas/ConceptChecklistItem'
          type: array
          maxItems: 50
          title: Checklist Items
        evidence:
          items:
            $ref: '#/components/schemas/SourceEvidence'
          type: array
          maxItems: 200
          title: Evidence
      additionalProperties: false
      type: object
      required:
      - id
      - version_no
      - name
      - summary
      - is_confirmed
      - is_current
      - confirmed_at
      - checklist_items
      - evidence
      title: ConceptVersion
      description: is_confirmed=true 및 confirmed_at이 필요하다. is_current=false인 확정 과거 버전도 허용한다.
    ConfirmedConcept:
      properties:
        concept_id:
          type: string
          format: uuid
          title: Concept Id
        unit_id:
          type: string
          format: uuid
          title: Unit Id
        material_id:
          type: string
          format: uuid
          title: Material Id
        version:
          $ref: '#/components/schemas/ConceptVersion'
      additionalProperties: false
      type: object
      required:
      - concept_id
      - unit_id
      - material_id
      - version
      title: ConfirmedConcept
    Coordinates:
      properties:
        x:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: X
        y:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Y
      additionalProperties: false
      type: object
      required:
      - x
      - y
      title: Coordinates
    CriterionFeedback:
      properties:
        checklist_item_id:
          type: string
          format: uuid
          title: Checklist Item Id
        learner_quote:
          type: string
          title: Learner Quote
        correct_explanation:
          type: string
          title: Correct Explanation
        improvement:
          type: string
          title: Improvement
        evidence:
          items:
            $ref: '#/components/schemas/SourceEvidence'
          type: array
          title: Evidence
      additionalProperties: false
      type: object
      required:
      - checklist_item_id
      - learner_quote
      - correct_explanation
      - improvement
      - evidence
      title: CriterionFeedback
    DetailedEvaluationRequest:
      properties:
        model_id:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Model Id
          description: 외부 텍스트 AI 호출에서는 명시 필수. 스키마 기본값 null은 런타임 생략 허용을 뜻하지 않는다. 로컬 채점은 예외.
        context:
          $ref: '#/components/schemas/StudyContext'
        concept_version_id:
          type: string
          format: uuid
          title: Concept Version Id
        history:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          maxItems: 100
          minItems: 1
          title: History
        explanation_language:
          type: string
          enum:
          - ko
          - en
          title: Explanation Language
          default: ko
        previous_result:
          anyOf:
          - $ref: '#/components/schemas/EvaluationResult'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - context
      - concept_version_id
      - history
      title: DetailedEvaluationRequest
    DetailedEvaluationResult:
      properties:
        report:
          $ref: '#/components/schemas/EvaluationResult'
        feedback:
          items:
            $ref: '#/components/schemas/CriterionFeedback'
          type: array
          title: Feedback
        comparison:
          anyOf:
          - $ref: '#/components/schemas/EvaluationComparison'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - report
      - feedback
      title: DetailedEvaluationResult
    Document:
      properties:
        pages:
          items:
            $ref: '#/components/schemas/Page'
          type: array
          maxItems: 200
          minItems: 1
          title: Pages
      additionalProperties: false
      type: object
      required:
      - pages
      title: Document
    DraftAnalysis:
      properties:
        state:
          type: string
          const: draft
          title: State
          default: draft
        units:
          items:
            $ref: '#/components/schemas/DraftUnit'
