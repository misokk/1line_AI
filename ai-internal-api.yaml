openapi: 3.1.0
info:
  title: TeachMe AI 내부 통신 API
  version: 0.3.0
  description: '메인 백엔드 → AI 서버 통신 계약. 사용자용 백엔드 공개 API와 별도이다.

    HTTP 경로·요청·성공 응답 스키마는 현재 FastAPI에서 추출하고, 타입 선언이 없는 응답·런타임 제약·오류·WebSocket 규약을 보충했다.

    동기 HTTP 처리이며 Job/DB/사용자 권한/재시도 제어는 메인 백엔드 책임이다. 응답을 data로 감싸지 않는다(GET 모델 목록 제외).

    AI 서버는 단원·개념·문제·보고서의 영구 DB ID를 생성하지 않는다. 음성 session_id는 예외로 AI 서버의 임시 연결 ID이다.

    인증 헤더·키·connection_token을 로그나 저장소에 기록하지 않는다. 문서의 예시는 합성 데이터이다.

    이 파일은 코드의 변경으로 자동 갱신되지 않으므로 변경 시 실제 /openapi.json과 다시 대조한다.'
paths:
  /health:
    get:
      summary: 상태 확인
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    const: ok
                additionalProperties: false
      description: 인증 없이 프로세스의 상태를 확인한다. 외부 모델 접근/DB 연결을 검사하지 않는다.
      tags:
      - 상태
      security: []
  /internal/models:
    get:
      summary: 텍스트 모델 목록
      operationId: models_internal_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - provider
                      - label
                      - available
                      properties:
                        id:
                          type: string
                        provider:
                          type: string
                        label:
                          type: string
                        available:
                          type: boolean
                      additionalProperties: false
                additionalProperties: false
        '401':
          $ref: '#/components/responses/InternalError401'
        '409':
          $ref: '#/components/responses/InternalError409'
        '413':
          $ref: '#/components/responses/InternalError413'
        '422':
          $ref: '#/components/responses/InternalError422'
        '429':
          $ref: '#/components/responses/InternalError429'
        '502':
          $ref: '#/components/responses/InternalError502'
        '503':
          $ref: '#/components/responses/InternalError503'
        '504':
          $ref: '#/components/responses/InternalError504'
      security:
      - ServerKey: []
      description: 서버 설정 목록이며 외부 접근 검증 결과가 아니다. available은 설정과 SDK 가용성 기준이다.
      tags:
      - 모델
  /internal/models/validate-key:
    post:
      summary: 모델 접근 확인
      operationId: validate_key_internal_models_validate_key_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRequest'
            examples:
              synthetic:
                summary: 합성 데이터. 백엔드 DB 값과 실제 허용 model_id로 교체한다.
                value:
                  model_id: gemini:YOUR_TEXT_MODEL
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - valid
                - model_id
                properties:
                  valid:
                    type: boolean
                    const: true
                  model_id:
                    type: string
                additionalProperties: false
        '422':
          $ref: '#/components/responses/InternalError422'
        '401':
          $ref: '#/components/responses/InternalError401'
        '409':
          $ref: '#/components/responses/InternalError409'
        '413':
          $ref: '#/components/responses/InternalError413'
        '429':
          $ref: '#/components/responses/InternalError429'
        '502':
          $ref: '#/components/responses/InternalError502'
        '503':
          $ref: '#/components/responses/InternalError503'
        '504':
          $ref: '#/components/responses/InternalError504'
      security:
      - ServerKey: []
      description: 명시적 model_id 필수. Gemini models.get으로 키·모델 접근만 확인하며 콘텐츠를 생성하지 않는다.
      tags:
      - 모델
      parameters:
      - name: X-AI-Key
        in: header
        required: false
        description: 선택 헤더. 텍스트 AI 호출용 BYOK이며 서버 인증키를 대신하지 않는다. 서버 키 대체 설정이 꺼져 있으면 외부 텍스트 호출에 필수이다.
        schema:
          type: string
  /internal/materials/extract:
    post:
      summary: 문서 추출
      operationId: extract_internal_materials_extract_post
      security:
      - ServerKey: []
      parameters:
      - name: filename
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
          default: material
          title: Filename
      - name: material_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Material Id
      - name: retry_failed
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Retry Failed
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extraction'
        '422':
          $ref: '#/components/responses/InternalError422'
        '401':
          $ref: '#/components/responses/InternalError401'
        '409':
          $ref: '#/components/responses/InternalError409'
        '413':
          $ref: '#/components/responses/InternalError413'
        '429':
          $ref: '#/components/responses/InternalError429'
        '502':
          $ref: '#/components/responses/InternalError502'
        '503':
          $ref: '#/components/responses/InternalError503'
        '504':
          $ref: '#/components/responses/InternalError504'
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      description: multipart가 아닌 원본 파일 bytes를 Content-Type과 함께 전송한다. PDF/PNG/JPEG는 Upstage, TXT는 로컬 처리. chunk_drafts는
        저장 전 청크이다. ready_for_analysis/warnings/review_required_pages를 확인하고 검토가 필요한 페이지를 처리한다. material_id는 백엔드 UUID
        v4를 권장한다. retry_failed=true는 실패한 인식의 명시적 재실행을 위한 값이며 외부 비용이 발생할 수 있다.
      tags:
      - 자료
  /internal/explanations/generate:
    post:
      summary: 확정 개념 설명
      operationId: explain_internal_explanations_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplanationRequest'
            examples:
              synthetic:
                summary: 합성 데이터. 백엔드 DB 값과 실제 허용 model_id로 교체한다.
                value:
                  model_id: gemini:YOUR_TEXT_MODEL
                  context: &id001
                    concepts:
                    - concept_id: 00000003-0000-4000-8000-000000000003
                      unit_id: 00000002-0000-4000-8000-000000000002
                      material_id: 00000001-0000-4000-8000-000000000001
                      version:
                        id: 00000004-0000-4000-8000-000000000004
                        version_no: 1
                        name: 습관
                        summary: 반복되는 행동의 의미
                        is_confirmed: true
                        is_current: true
                        confirmed_at: '2026-11-01T00:00:00+09:00'
                        checklist_items:
                        - id: 00000005-0000-4000-8000-000000000005
                          ordinal: 1
                          criterion: 습관이 반복되는 행동임을 설명한다.
                        evidence:
                        - &id004
                          chunk_id: 00000006-0000-4000-8000-000000000006
                          material_id: 00000001-0000-4000-8000-000000000001
                          material_name: sample.txt
                          page_number: 1
                          excerpt: 반복되는 행동은 습관이다.
                    chunks: &id003
                    - id: 00000006-0000-4000-8000-000000000006
                      material_id: 00000001-0000-4000-8000-000000000001
                      material_name: sample.txt
                      page_number: 1
                      text: 반복되는 행동은 습관이다.
                  concept_version_id: 00000004-0000-4000-8000-000000000004
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplanationContent'
        '422':
          $ref: '#/components/responses/InternalError422'
        '401':
          $ref: '#/components/responses/InternalError401'
        '409':
          $ref: '#/components/responses/InternalError409'
        '413':
          $ref: '#/components/responses/InternalError413'
        '429':
          $ref: '#/components/responses/InternalError429'
        '502':
          $ref: '#/components/responses/InternalError502'
        '503':
          $ref: '#/components/responses/InternalError503'
        '504':
          $ref: '#/components/responses/InternalError504'
      security:
      - ServerKey: []
      description: concept_version_id에 해당하는 확정 버전과 근거로 title/explanation_markdown/evidence를 반환한다. 모델 ID 필수.
      tags:
      - 설명
      parameters:
      - name: X-AI-Key
        in: header
        required: false
        description: 선택 헤더. 텍스트 AI 호출용 BYOK이며 서버 인증키를 대신하지 않는다. 서버 키 대체 설정이 꺼져 있으면 외부 텍스트 호출에 필수이다.
        schema:
          type: string
  /internal/study-time/estimate:
    post:
      summary: 학습량·시간 추정
      operationId: workload_internal_study_time_estimate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadRequest'
            examples:
              synthetic:
                summary: 합성 데이터. 백엔드 DB 값과 실제 허용 model_id로 교체한다.
                value: &id002
                  total_pages: 1
                  context: *id001
                  exam_date: '2026-12-14'
                  today: '2026-12-01'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadEstimate'
        '422':
          $ref: '#/components/responses/InternalError422'
        '401':
          $ref: '#/components/responses/InternalError401'
        '409':
          $ref: '#/components/responses/InternalError409'
        '413':
          $ref: '#/components/responses/InternalError413'
        '429':
          $ref: '#/components/responses/InternalError429'
        '502':
          $ref: '#/components/responses/InternalError502'
        '503':
          $ref: '#/components/responses/InternalError503'
        '504':
          $ref: '#/components/responses/InternalError504'
      security:
      - ServerKey: []
      description: 외부 AI 호출 없음. total_pages/context/exam_date 및 선택 today/progress를 받는다. progress를 보내면 context의 모든
        버전을 중복 없이 포함해야 하며 remaining_criteria는 확정 체크리스트 수 이하여야 한다. progress 생략 시 전체 미학습·개념당 문제 2개/Teach-back 1회/복습
        1회 기본값을 사용한다. 시험이 지난 경우 remaining_days=0이며 남은 학습량을 오늘 하루 기준으로 추정한다. 계획 생성의 과거 날짜 거절 규칙과 다르다.
      tags:
      - 계획
  /internal/study-plan/generate:
    post:
      summary: 날짜별 계획 생성
      operationId: study_plan_internal_study_plan_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadRequest'
            examples:
              synthetic:
                summary: 합성 데이터. 백엔드 DB 값과 실제 허용 model_id로 교체한다.
                value: *id002
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
        '422':
          $ref: '#/components/responses/InternalError422'
        '401':
          $ref: '#/components/responses/InternalError401'
        '409':
          $ref: '#/components/responses/InternalError409'
        '413':
          $ref: '#/components/responses/InternalError413'
        '429':
          $ref: '#/components/responses/InternalError429'
        '502':
          $ref: '#/components/responses/InternalError502'
        '503':
          $ref: '#/components/responses/InternalError503'
        '504':
          $ref: '#/components/responses/InternalError504'
      security:
      - ServerKey: []
      description: 외부 AI 호출 없음. estimate와 같은 입력. 시험 전날까지 배치, 시험 당일이면 오늘로 압축. 과거 날짜/366일 초과 거절. 취약·미학습 우선, 학습→문제→Teach-back
        후 복습 배치. 하루 공부 가능 시간 입력/완료 이력/일정 저장은 제공하지 않는다. today_tasks는 days의 오늘 할 일과 중복된 조회 편의 필드이다.
      tags:
      - 계획
  /internal/evaluations/detailed:
    post:
      summary: 상세 이해도 평가·비교
      operationId: detailed_evaluation_internal_evaluations_detailed_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetailedEvaluationRequest'
            examples:
              synthetic:
                summary: 합성 데이터. 백엔드 DB 값과 실제 허용 model_id로 교체한다.
                value:
                  model_id: gemini:YOUR_TEXT_MODEL
                  context: *id001
                  concept_version_id: 00000004-0000-4000-8000-000000000004
                  history: &id006
                  - role: user
                    content: 습관은 반복되는 행동이에요.
                  previous_result: null
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedEvaluationResult'
        '422':
          $ref: '#/components/responses/InternalError422'
        '401':
          $ref: '#/components/responses/InternalError401'
        '409':
          $ref: '#/components/responses/InternalError409'
        '413':
          $ref: '#/components/responses/InternalError413'
        '429':
          $ref: '#/components/responses/InternalError429'
        '502':
          $ref: '#/components/responses/InternalError502'
        '503':
          $ref: '#/components/responses/InternalError503'
        '504':
          $ref: '#/components/responses/InternalError504'
      security:
      - ServerKey: []
      description: report에 기본 평가, feedback에 발화 인용/교정/개선점/근거를 반환한다. previous_result 생략 시 comparison=null. 같은 버전·같은
        체크리스트일 때 비교 가능하며 coverage_delta=현재-이전이다. 이전 평가를 이번 사용자 설명의 증거로 사용하지 않는다. 모델 ID 필수.
      tags:
      - 평가
      parameters:
      - name: X-AI-Key
        in: header
        required: false
        description: 선택 헤더. 텍스트 AI 호출용 BYOK이며 서버 인증키를 대신하지 않는다. 서버 키 대체 설정이 꺼져 있으면 외부 텍스트 호출에 필수이다.
        schema:
          type: string
  /internal/materials/analyze:
    post:
      summary: 개념 초안 분석
      operationId: analyze_internal_materials_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
            examples:
              synthetic:
                summary: 합성 데이터. 백엔드 DB 값과 실제 허용 model_id로 교체한다.
                value:
                  model_id: gemini:YOUR_TEXT_MODEL
                  chunks: *id003
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftAnalysis'
        '422':
          $ref: '#/components/responses/InternalError422'
        '401':
          $ref: '#/components/responses/InternalError401'
        '409':
          $ref: '#/components/responses/InternalError409'
        '413':
          $ref: '#/components/responses/InternalError413'
        '429':
          $ref: '#/components/responses/InternalError429'
        '502':
          $ref: '#/components/responses/InternalError502'
        '503':
          $ref: '#/components/responses/InternalError503'
        '504':
          $ref: '#/components/responses/InternalError504'
      security:
      - ServerKey: []
      description: 저장된 SourceChunk와 명시적 model_id를 전달한다. state=draft인 단원·개념·문자열 체크리스트·근거 초안을 반환한다. 확정/DB 저장은 백엔드가
        수행한다.
      tags:
      - 자료
      parameters:
      - name: X-AI-Key
        in: header
        required: false
        description: 선택 헤더. 텍스트 AI 호출용 BYOK이며 서버 인증키를 대신하지 않는다. 서버 키 대체 설정이 꺼져 있으면 외부 텍스트 호출에 필수이다.
        schema:
          type: string
  /internal/questions/generate:
    post:
      summary: 5~20문항 생성
      operationId: generate_internal_questions_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionGenerationRequest'
            examples:
              synthetic:
                summary: 합성 데이터. 백엔드 DB 값과 실제 허용 model_id로 교체한다.
                value:
                  model_id: gemini:YOUR_TEXT_MODEL
                  context: *id001
                  unit_id: 00000002-0000-4000-8000-000000000002
                  concept_version_ids:
                  - 00000004-0000-4000-8000-000000000004
                  count: 5
                  difficulty: mixed
                  difficulty_plan:
                  - easy
                  - medium
                  - hard
                  - easy
                  - medium
                  question_types:
                  - multiple_choice
                  - short_answer
                  explanation_language: ko
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedQuestions'
        '422':
          $ref: '#/components/responses/InternalError422'
        '401':
          $ref: '#/components/responses/InternalError401'
        '409':
          $ref: '#/components/responses/InternalError409'
        '413':
          $ref: '#/components/responses/InternalError413'
        '429':
          $ref: '#/components/responses/InternalError429'
        '502':
          $ref: '#/components/responses/InternalError502'
        '503':
          $ref: '#/components/responses/InternalError503'
        '504':
          $ref: '#/components/responses/InternalError504'
      security:
      - ServerKey: []
      description: count 5~20. mixed는 count와 같은 길이이며 최소 두 난이도를 포함한 difficulty_plan 필수, 단일 난이도에서는 difficulty_plan을
        전달하지 않는다. question_types는 한 유형 또는 두 유형 선택이며 정확한 유형별 개수 입력은 없다. StoredQuestion 정답·해설은 백엔드 비공개 저장. verification은
        산술 일관성 검사이며 not_verified는 의미 오류나 생성 실패를 뜻하지 않는다. 분할 호출 실패 시 전체 요청이 실패한다. 모델 ID 필수.
      tags:
      - 문제
      parameters:
      - name: X-AI-Key
        in: header
        required: false
        description: 선택 헤더. 텍스트 AI 호출용 BYOK이며 서버 인증키를 대신하지 않는다. 서버 키 대체 설정이 꺼져 있으면 외부 텍스트 호출에 필수이다.
        schema:
          type: string
  /internal/questions/grade:
    post:
      summary: 문제 1개 채점
      operationId: grade_internal_questions_grade_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeRequest'
            examples:
              synthetic:
                summary: 합성 데이터. 백엔드 DB 값과 실제 허용 model_id로 교체한다.
                value:
                  model_id: gemini:YOUR_TEXT_MODEL
                  context: *id001
                  stored_question:
                    question: &id007
                      question_type: short_answer
                      concept_ids:
                      - 00000003-0000-4000-8000-000000000003
                      concept_version_ids:
                      - 00000004-0000-4000-8000-000000000004
                      prompt: 반복되는 행동을 무엇이라고 하나요?
                      options: []
                      difficulty: easy
                      evidence:
                      - *id004
                    correct_answer:
                      type: short_answer
                      text: 습관
                    explanation: 원문에서 반복되는 행동을 습관이라고 합니다.
                    accepted_answers:
                    - 습관
                    arithmetic_expression: null
                  answer:
                    type: short_answer
                    text: 습관
